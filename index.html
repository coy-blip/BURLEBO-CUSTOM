  header>*{position:relative;z-index:1}
  header .logo{height:24px;display:block}
  header .brandlabel{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
  header .nav{display:flex;gap:4px}
  header .nav button{background:rgba(255,255,255,.15);border:none;color:#fff;font:inherit;font-size:13px;
    padding:6px 12px;border-radius:7px;cursor:pointer}
  header .nav button:hover{background:rgba(255,255,255,.3)}
  header .who{margin-left:auto;font-size:13px;opacity:.95}
  header .who select{font:inherit;border:none;border-radius:7px;padding:5px 10px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
  header .who select option{color:#23271f}
  .people{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .people .pchip{background:rgba(255,255,255,.16);border:none;color:#fff;font:inherit;font-size:12px;
    padding:5px 10px;border-radius:20px;cursor:pointer}
  .people .pchip:hover{background:rgba(255,255,255,.3)}
  .people .pcount{opacity:.85;margin-left:5px;font-weight:600}
  main{max-width:920px;margin:0 auto;padding:22px 16px 60px}
  .btn{font:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;
    padding:8px 14px;border-radius:8px;font-size:14px}
  .btn.secondary{background:#fff;color:var(--accent)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn:focus-visible{outline:2px solid #23271f;outline-offset:2px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .proj-card{cursor:pointer}
  .proj-card:hover{border-color:var(--accent)}
  .proj-card h3{margin:0 0 4px;font-size:16px}
  .meta{color:var(--muted);font-size:13px}
  .badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);
    color:var(--accent);font-weight:600;white-space:nowrap}
  .badge.final{background:#e7efe0;color:#3a5226}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
  input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .feed-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .feed-item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .feed-item .name{font-weight:600;word-break:break-word}
  .feed-item .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .muted-empty{color:var(--muted);font-size:14px;padding:14px 0}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted);
    cursor:pointer;background:#fbfbf8}
  .drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .tabs{display:flex;gap:6px;margin:6px 0 12px}
  .hidden{display:none!important}

  .back{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;margin-bottom:8px;font-size:14px}
  .prod{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fbfbf8}
  .sizegroup{margin-top:10px}
  .sg-label{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .sg-row{display:flex;flex-wrap:wrap;gap:6px}
  .sz{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);margin:0;gap:2px}
  .sz input{width:54px;padding:5px 4px;text-align:center}
  .ms-row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
  .ms-label{font-size:13px}
  .ms-row input{margin:0}
  .ms-done{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin:0;white-space:nowrap}
  .ms-done input{width:auto}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;padding:4px;text-transform:uppercase;letter-spacing:.4px}
  .cal-cell{min-height:90px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.today{border-color:var(--accent);background:var(--accent-soft)}
  .cal-daynum{color:var(--muted);font-size:11px}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px;margin-top:3px;
    cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:11px}
  .chip:hover{background:#dfe4d4}
  .cal-cell.has-items{cursor:pointer}
  .cal-cell.has-items:hover{border-color:var(--accent);background:#fafbf7}
  .modal-bg{position:fixed;inset:0;background:rgba(20,22,18,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:48px 16px;z-index:50;overflow:auto}
  .modal{background:var(--card);border-radius:12px;max-width:540px;width:100%;padding:20px}
  .day-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .day-item .di-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  @media(max-width:600px){.grid2{grid-template-columns:1fr}.cal-cell{min-height:64px}.ms-row{grid-template-columns:1fr}}
</style>

      <button onclick="go()">Projects</button>

<script>
const { createClient } = supabase;
let db = null;
let me = localStorage.getItem("cc_name") || "";
let calRef = new Date(); calRef.setDate(1);
const todayStr = () => new Date().toLocaleDateString("en-CA");

function tryGate(){
  if(document.getElementById("pw").value === APP_PASSWORD){ sessionStorage.setItem("cc_ok","1"); startApp(); }
  else { document.getElementById("gateErr").textContent = "Wrong password."; }
}
function rememberBy(){
  const el=document.getElementById("a_by"); const by=el?el.value.trim():"";
  if(by){ me=by; localStorage.setItem("cc_name", by); }
  return by;
}
function startApp(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  db = createClient(SUPABASE_URL, SUPABASE_ANON);
  route();
}
window.addEventListener("DOMContentLoaded", ()=>{ if(sessionStorage.getItem("cc_ok")==="1") startApp(); });

function route(){
  if(db) loadPeople();
  const params = new URLSearchParams(location.search);
  const id = params.get("p"), v = params.get("view"), person = params.get("person");
  if(id) renderDetail(id);
  else if(person) renderPerson(person);
  else if(v==="calendar") renderCalendar();
  else if(v==="completed") renderCompleted();
  else renderList();
}
function go(id){ const u=new URL(location); u.search=""; if(id) u.searchParams.set("p",id); history.pushState({},"",u); route(); }
function goCalendar(){ const u=new URL(location); u.search=""; u.searchParams.set("view","calendar"); history.pushState({},"",u); route(); }
function goCompleted(){ const u=new URL(location); u.search=""; u.searchParams.set("view","completed"); history.pushState({},"",u); route(); }
function goPerson(enc){ const name=decodeURIComponent(enc); const u=new URL(location); u.search=""; u.searchParams.set("person",name); history.pushState({},"",u); route(); }
window.addEventListener("popstate", route);

const esc = s => (s??"").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => d ? new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "—";
const fmtStamp = t => new Date(t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const money = n => "$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// ---------- LIST ----------
async function renderList(){
  const view = document.getElementById("view");
  view.innerHTML = `<div class="row between" style="margin-bottom:14px">
      <h2 style="margin:0;font-size:20px">Projects</h2>
      <button class="btn" onclick="renderNew()">New project</button>
    </div><div id="list" class="muted-empty">Loading…</div>`;
  const [{data:projects,error}, {data:ms}, {data:skus}] = await Promise.all([
    db.from("projects").select("*").order("created_at",{ascending:false}),
    db.from("project_milestones").select("project_id,milestone_key,due_date").not("due_date","is",null).not("completed","is",true),
    db.from("project_skus").select("project_id,estimated_units")
  ]);
  const list = document.getElementById("list");
  if(error){ list.innerHTML = `<div class="muted-empty">Couldn't load projects: ${esc(error.message)}</div>`; return; }
  const active = (projects||[]).filter(p=> (p.status||"")!=="Complete");
  if(!active.length){ list.innerHTML = `<div class="muted-empty">No active projects. Start one with "New project".</div>`; return; }

  const byP={}; (ms||[]).forEach(m=>{ (byP[m.project_id] ||= []).push(m); });
  const units={}; (skus||[]).forEach(s=>{ units[s.project_id]=(units[s.project_id]||0)+(s.estimated_units||0); });
  const today = todayStr();
  function nextHint(pid){
    const arr=(byP[pid]||[]).filter(m=>m.due_date).sort((a,b)=> a.due_date<b.due_date?-1:1);
    const up=arr.find(m=>m.due_date>=today); if(!up) return "";
    const lbl=(MS_BY_KEY[up.milestone_key]||{}).short||up.milestone_key;
    return `next: ${lbl} ${fmtDate(up.due_date)}`;
  }
  list.innerHTML = active.map(p => {
    const hint = nextHint(p.id); const u = units[p.id]||0;
    return `<div class="card proj-card" onclick="go('${p.id}')">
      <div class="row between"><h3>${esc(p.project_name)}</h3><span class="badge">${esc(p.status||"New")}</span></div>
      <div class="meta">${esc(p.customer_name||"No customer")} · ${u?u+" units":"— units"}${hint?" · "+hint:""}</div>
    </div>`;
  }).join("");
}

// ---------- COMPLETED ----------
async function renderCompleted(){
  const view = document.getElementById("view");
  view.innerHTML = `<h2 style="margin:0 0 14px;font-size:20px">Completed projects</h2>
    <div id="clist" class="muted-empty">Loading…</div>`;
  const { data, error } = await db.from("projects").select("*")
    .eq("status","Complete").order("completed_at",{ascending:false,nullsFirst:false});
  const el = document.getElementById("clist");
  if(error){ el.innerHTML = `<div class="muted-empty">Couldn't load: ${esc(error.message)}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = `<div class="muted-empty">No completed projects yet.</div>`; return; }
  el.innerHTML = data.map(p=>{
    const when = p.completed_at
      ? new Date(p.completed_at).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})
      : "date not recorded";
    return `<div class="card proj-card" onclick="go('${p.id}')">
      <div class="row between"><h3>${esc(p.project_name)}</h3><span class="badge final">Completed ${esc(when)}</span></div>
      <div class="meta">${esc(p.customer_name||"No customer")}</div>
    </div>`;
  }).join("");
}

// ---------- people in nav ----------
async function loadPeople(){
  const el = document.getElementById("people");
  if(!el || !db) return;
  const { data } = await db.from("project_milestones").select("project_id,assigned_to").not("assigned_to","is",null).not("completed","is",true);
  const map={};
  (data||[]).forEach(m=>{ const n=(m.assigned_to||"").trim(); if(!n) return; (map[n] ||= new Set()).add(m.project_id); });
  const names = Object.keys(map).sort((a,b)=> a.localeCompare(b));
  el.innerHTML = names.map(n=>`<button class="pchip" onclick="goPerson('${encodeURIComponent(n)}')">${esc(n)}<span class="pcount">${map[n].size}</span></button>`).join("");
}

async function renderPerson(name){
  const view=document.getElementById("view");
  view.innerHTML = `<button class="back" onclick="go()">← All projects</button>
    <h2 style="margin:0 0 12px;font-size:20px">${esc(name)}'s assignments</h2>
    <div id="plist" class="muted-empty">Loading…</div>`;
  const { data, error } = await db.from("project_milestones")
    .select("project_id,due_date,milestone_key,assigned_to,projects(project_name,status)")
    .eq("assigned_to", name).not("completed","is",true);
  const el=document.getElementById("plist");
  if(error){ el.innerHTML=`<div class="muted-empty">Couldn't load: ${esc(error.message)}</div>`; return; }
  if(!data || !data.length){ el.innerHTML=`<div class="muted-empty">Nothing assigned to ${esc(name)} right now.</div>`; return; }
  const byProj={};
  data.forEach(m=>{ (byProj[m.project_id] ||= {name:(m.projects&&m.projects.project_name)||"Project", status:(m.projects&&m.projects.status)||"", items:[]}).items.push(m); });
  const entries = Object.entries(byProj).map(([pid,info])=>{
    const dates = info.items.map(i=>i.due_date).filter(Boolean).sort();
    return {pid, info, soonest: dates[0]||"9999-99-99"};
  }).sort((a,b)=> a.soonest<b.soonest?-1:1);
  el.innerHTML = entries.map(({pid,info})=>{
    const ms = info.items.slice().sort((a,b)=> (a.due_date||"9999")<(b.due_date||"9999")?-1:1)
      .map(i=>{ const lbl=(MS_BY_KEY[i.milestone_key]||{}).label||i.milestone_key;
        return `<div class="row between" style="margin-top:4px">
          <span class="meta">• ${esc(lbl)} — ${i.due_date?fmtDate(i.due_date):"no date set"}</span>
          <button class="btn ghost small" onclick="event.stopPropagation();markDone('${pid}','${i.milestone_key}')">Mark done</button>
        </div>`; }).join("");
    return `<div class="card proj-card" onclick="go('${pid}')">
      <div class="row between"><h3>${esc(info.name)}</h3><span class="badge">${esc(info.status||"New")}</span></div>
      <div style="margin-top:6px">${ms}</div></div>`;
  }).join("");
}

// ---------- milestone rows ----------
function milestoneRowsHtml(existing){
  existing = existing || {};
  return MILESTONES.map(m=>{
    const e = existing[m.key] || {};
    return `<div class="ms-row">
      <div class="ms-label">${esc(m.label)}</div>
      <input class="ms-date" type="date" data-key="${m.key}" value="${e.due_date||''}">
      <input class="ms-person" placeholder="assigned to" data-key="${m.key}" value="${esc(e.assigned_to||'')}">
      <label class="ms-done"><input type="checkbox" class="ms-complete" data-key="${m.key}" ${e.completed?'checked':''}> done</label>
    </div>`;
  }).join("");
}
function collectMilestones(scope, projectId){
  const dates={}, persons={}, done={};
  scope.querySelectorAll(".ms-date").forEach(i=> dates[i.dataset.key]=i.value);
  scope.querySelectorAll(".ms-person").forEach(i=> persons[i.dataset.key]=i.value.trim());
  scope.querySelectorAll(".ms-complete").forEach(i=> done[i.dataset.key]=i.checked);
  return MILESTONES.map(m=>({ project_id:projectId, milestone_key:m.key,
    due_date: dates[m.key]||null, assigned_to: persons[m.key]||null, completed: !!done[m.key] }))
    .filter(r=> r.due_date || r.assigned_to || r.completed);
}

// ---------- pricing fields ----------
function pricingFieldsHtml(existing){
  existing = existing || {};
  return PRICING_FIELDS.map(f=>{
    const v = (existing[f.key]!=null) ? existing[f.key] : "";
    if(f.type==="money") return `<div><label>${esc(f.label)}</label><input class="pr" data-key="${f.key}" data-type="money" type="number" step="0.01" min="0" value="${esc(v)}"></div>`;
    return `<div><label>${esc(f.label)}</label><input class="pr" data-key="${f.key}" data-type="text" value="${esc(v)}"></div>`;
  }).join("");
}
function collectPricing(scope){
  const obj={};
  scope.querySelectorAll(".pr").forEach(i=>{
    const val=i.value.trim(); if(val==="") return;
    obj[i.dataset.key] = i.dataset.type==="money" ? parseFloat(val) : val;
  });
  return obj;
}

// ---------- product entry ----------
function sizeGroupsHtml(){
  return Object.entries(SIZES).map(([cat,sizes])=>`
    <div class="sizegroup"><div class="sg-label">${cat}</div><div class="sg-row">
      ${sizes.map(sz=>`<label class="sz">${esc(sz)}
        <input class="p-size" type="number" min="0" data-key="${esc(cat+'|'+sz)}" oninput="recalcTotal(this)"></label>`).join("")}
    </div></div>`).join("");
}
function productCardHtml(){
  return `<div class="prod">
    <div class="grid2"><div><label>Product name</label><input class="p-name"></div>
      <div><label>SKU</label><input class="p-sku"></div></div>
    <label>Total units <span class="meta" style="text-transform:none">— auto-sums from sizes, or type a number</span></label>
    <input class="p-total" type="number" min="0">
    ${sizeGroupsHtml()}
    <div style="margin-top:8px"><button class="link-x" onclick="this.closest('.prod').remove()">remove product</button></div>
  </div>`;
}
function recalcTotal(el){
  const prod = el.closest(".prod"); let sum=0;
  prod.querySelectorAll(".p-size").forEach(s=> sum += parseInt(s.value)||0);
  if(sum>0) prod.querySelector(".p-total").value = sum;
}

async function saveProject(){
  const name = document.getElementById("f_name").value.trim();
  if(!name){ document.getElementById("saveMsg").textContent = "Project name is required."; return; }
  document.getElementById("saveBtn").disabled = true;
  document.getElementById("saveMsg").textContent = "Saving…";

  const payload = {
    project_name: name, status: document.getElementById("f_status").value,
    customer_name: document.getElementById("f_customer").value.trim() || null,
    customer_email: document.getElementById("f_email").value.trim() || null,
    customer_phone: document.getElementById("f_phone").value.trim() || null,
    created_by: document.getElementById("f_rep").value.trim() || me || null,
    pricing: collectPricing(document.getElementById("priceNew")),
    pricing_notes: document.getElementById("f_pricing").value.trim() || null,
    notes: document.getElementById("f_notes").value.trim() || null
  };
  const { data, error } = await db.from("projects").insert(payload).select().single();
  if(error){ document.getElementById("saveMsg").textContent = "Error: "+error.message; document.getElementById("saveBtn").disabled=false; return; }

  const milestones = collectMilestones(document.getElementById("msNew"), data.id);
  if(milestones.length) await db.from("project_milestones").insert(milestones);

  const prods = [...document.querySelectorAll("#prods .prod")].map(p=>{
    const sizes={};
    p.querySelectorAll(".p-size").forEach(s=>{ const v=parseInt(s.value)||0; if(v>0) sizes[s.dataset.key]=v; });
    const total = parseInt(p.querySelector(".p-total").value) || Object.values(sizes).reduce((a,b)=>a+b,0) || null;
    return { project_id:data.id, product_name:p.querySelector(".p-name").value.trim()||null,
      sku:p.querySelector(".p-sku").value.trim()||null, estimated_units:total, sizes };
  }).filter(r=> r.product_name||r.sku||r.estimated_units||Object.keys(r.sizes).length);
  if(prods.length) await db.from("project_skus").insert(prods);

  go(data.id);
}

    db.from("projects").select("*").eq("id",id).single(),
    db.from("project_skus").select("*").eq("project_id",id).order("created_at"),
    db.from("project_assets").select("*").eq("project_id",id).order("created_at",{ascending:false}),
    db.from("project_milestones").select("*").eq("project_id",id)
  ]);
  if(pe || !p){ document.getElementById("detail").innerHTML = `<div class="muted-empty">Project not found.</div>`; return; }

  const msMap={}; (mss||[]).forEach(m=> msMap[m.milestone_key]={due_date:m.due_date, assigned_to:m.assigned_to, completed:m.completed});
  const totalUnits = (skus||[]).reduce((a,s)=> a+(s.estimated_units||0),0);

  const prodRows = (skus&&skus.length) ? skus.map(s=>{
    const sizeStr = s.sizes && Object.keys(s.sizes).length
      ? Object.entries(s.sizes).map(([k,v])=>`${esc(k.replace('|',' '))} ${v}`).join(",  ") : "";

        <span class="name">${esc(s.product_name||s.sku||"Product")}</span>

    <div class="card"><h3 style="margin:0 0 8px;font-size:16px">Pricing</h3>
      <div class="grid2">${prFilled.map(f=>`<div class="meta"><strong>${esc(f.label)}:</strong> ${f.type==="money"?money(pr[f.key]):esc(pr[f.key])}</div>`).join("")}</div>

        <select id="d_status" onchange="updateStatus('${p.id}', this.value)">

      </div>

        <div class="meta"><strong>Customer:</strong> ${esc(p.customer_name||"—")}</div>
        <div class="meta"><strong>Email:</strong> ${esc(p.customer_email||"—")}</div>
        <div class="meta"><strong>Phone:</strong> ${esc(p.customer_phone||"—")}</div>
        <div class="meta"><strong>Total units:</strong> ${totalUnits||"—"}</div>
        <div class="meta"><strong>Sales rep:</strong> ${esc(p.created_by||"—")}</div>
      </div>
      ${p.notes?`<div class="meta" style="margin-top:8px"><strong>Notes:</strong> ${esc(p.notes)}</div>`:""}
    </div>

    ${pricingCard}

    <div class="card">
      <div class="row between"><h3 style="margin:0;font-size:16px">Timeline</h3>

async function saveMilestones(pid){
  const rows = collectMilestones(document.getElementById("msEdit"), pid);
  document.getElementById("msMsg").textContent = "Saving…";
  const del = await db.from("project_milestones").delete().eq("project_id", pid);
  if(del.error){ document.getElementById("msMsg").textContent = "Error: "+del.error.message; return; }
  if(rows.length){ const ins = await db.from("project_milestones").insert(rows);
    if(ins.error){ document.getElementById("msMsg").textContent = "Error: "+ins.error.message; return; } }
  document.getElementById("msMsg").textContent = "Saved.";
  loadPeople();
}

// ---------- delete (double confirm) ----------
function armDelete(pid){
  document.getElementById("dangerZone").innerHTML = `
    <p class="meta" style="color:var(--danger);margin:0 0 8px">This permanently removes the project and all of its products, timeline, files, and links. This cannot be undone.</p>
    <div class="row">
      <button class="btn danger" onclick="reallyDeleteProject('${pid}')">Yes, delete permanently</button>
      <button class="btn ghost" onclick="renderDetail('${pid}')">Cancel</button>
    </div>`;
}
async function reallyDeleteProject(pid){
  if(!confirm("Final check: permanently delete this project and everything in it?")) return;
  try{
    const { data:files } = await db.storage.from(BUCKET).list(pid);
    if(files && files.length) await db.storage.from(BUCKET).remove(files.map(f=> pid+"/"+f.name));
  }catch(e){ /* ignore storage cleanup errors, still delete the record */ }
  const { error } = await db.from("projects").delete().eq("id", pid);
  if(error){ alert("Couldn't delete: "+error.message); return; }
  go();
}

function renderFeed(assets){
  if(!assets || !assets.length) return `<div class="muted-empty">No files or links yet.</div>`;
  return assets.map(a=>{
    const url = a.asset_type==="file" ? db.storage.from(BUCKET).getPublicUrl(a.file_path).data.publicUrl : a.external_url;
    const name = a.asset_type==="file" ? (a.file_name||"file") : a.external_url;
    return `<div class="feed-item"><div class="top">
        <span class="badge">${esc(a.category||"Other")}</span>
        ${a.is_finalized?`<span class="badge final">Finalized</span>`:""}
        <span class="name">${esc(a.label||name)}</span></div>
      <div class="sub">
        <a href="${esc(url)}" target="_blank" rel="noopener">${a.asset_type==="file"?"Open file":"Open link"}</a>
        · ${esc(a.added_by||"someone")} · ${fmtStamp(a.created_at)}
        · <button class="link-x" style="color:var(--accent)" onclick="toggleFinal('${a.id}', ${!a.is_finalized})">${a.is_finalized?"unmark final":"mark final"}</button>
        · <button class="link-x" onclick="deleteAsset('${a.id}')">delete</button></div></div>`;
  }).join("");
}

function showAdd(mode){
  const a = document.getElementById("addArea");
  const common = `<div class="grid2">
      <div><label>Label</label><input id="a_label" placeholder="e.g. Logo option 2"></div>
      <div><label>Category</label><select id="a_cat">${CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div><label>Added by (optional)</label><input id="a_by" value="${esc(me)}" placeholder="your name"></div>
    </div>`;
  if(mode==="link"){
    a.innerHTML = common + `<label>Link (Dropbox, Drive, etc.)</label><input id="a_url" placeholder="https://…">
      <div class="row" style="margin-top:10px"><button class="btn small" onclick="addLink()">Add link</button><span id="a_msg" class="meta"></span></div>`;
  } else {
    a.innerHTML = common + `<label>Files</label>
      <div class="drop" id="drop" onclick="document.getElementById('a_file').click()">Drag files here, or click to choose. You can drop several at once.</div>
      <input id="a_file" type="file" multiple class="hidden" onchange="addFiles(this.files)">
      <div class="row" style="margin-top:8px"><span id="a_msg" class="meta"></span></div>`;
    const d = document.getElementById("drop");
    d.addEventListener("dragover", e=>{e.preventDefault();d.classList.add("over")});
    d.addEventListener("dragleave", ()=>d.classList.remove("over"));
    d.addEventListener("drop", e=>{e.preventDefault();d.classList.remove("over");addFiles(e.dataTransfer.files)});
  }
}
async function addLink(){
  const url = document.getElementById("a_url").value.trim();
  if(!url){ document.getElementById("a_msg").textContent="Paste a link first."; return; }
  const by = rememberBy();
  const { error } = await db.from("project_assets").insert({ project_id: window.__pid, asset_type:"link",
    external_url:url, label: document.getElementById("a_label").value.trim() || null,
    category: document.getElementById("a_cat").value, added_by: by || null });
  if(error){ document.getElementById("a_msg").textContent="Error: "+error.message; return; }
  renderDetail(window.__pid);
}
async function addFiles(files){
  if(!files || !files.length) return;
  const msg = document.getElementById("a_msg");
  const label = document.getElementById("a_label").value.trim();
  const cat = document.getElementById("a_cat").value;
  const by = rememberBy();
  for(const f of files){
    msg.textContent = "Uploading "+f.name+"…";
    const path = window.__pid + "/" + Date.now() + "-" + f.name.replace(/[^\w.\-]/g,"_");
    const { error:upErr } = await db.storage.from(BUCKET).upload(path, f);
    if(upErr){ msg.textContent = "Upload failed: "+upErr.message; return; }
    await db.from("project_assets").insert({ project_id: window.__pid, asset_type:"file",
      file_path:path, file_name:f.name, label: label||null, category: cat, added_by: by||null });
  }
  renderDetail(window.__pid);
}
async function toggleFinal(id, val){ await db.from("project_assets").update({is_finalized:val}).eq("id",id); renderDetail(window.__pid); }
async function deleteAsset(id){ if(!confirm("Delete this entry?")) return; await db.from("project_assets").delete().eq("id",id); renderDetail(window.__pid); }
async function updateStatus(id, status){
  const patch = { status, completed_at: status==="Complete" ? new Date().toISOString() : null };
  await db.from("projects").update(patch).eq("id",id);
}

// ---------- CALENDAR ----------
async function renderCalendar(){
  const view = document.getElementById("view");
  const monthLabel = calRef.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  view.innerHTML = `
    <div class="cal-head"><h2 style="margin:0;font-size:20px">Calendar</h2>
      <div class="row">
        <button class="btn ghost small" onclick="shiftMonth(-1)">←</button>
        <strong style="min-width:150px;text-align:center">${monthLabel}</strong>
        <button class="btn ghost small" onclick="shiftMonth(1)">→</button>
        <button class="btn ghost small" onclick="calRef=new Date();calRef.setDate(1);renderCalendar()">Today</button>
      </div></div>
    <div id="cal" class="muted-empty">Loading…</div>`;

  const [{data:mss,error}, {data:projects}] = await Promise.all([
    db.from("project_milestones").select("project_id,due_date,assigned_to,milestone_key,projects(project_name,status)")
      .not("due_date","is",null).not("assigned_to","is",null).not("completed","is",true),
    db.from("projects").select("id,project_name")
  ]);
  const el = document.getElementById("cal");
  if(error){ el.innerHTML = `<div class="muted-empty">Couldn't load: ${esc(error.message)}</div>`; return; }

  const byDate={}; const scheduled=new Set();
  (mss||[]).forEach(m=>{ (byDate[m.due_date] ||= []).push(m); scheduled.add(m.project_id); });
  window.__calByDate = byDate;

  const year=calRef.getFullYear(), month=calRef.getMonth();
  const firstDow=new Date(year,month,1).getDay(), daysIn=new Date(year,month+1,0).getDate();
  const today=todayStr();
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-dow">${d}</div>`).join("");

  let cells="";
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysIn; d++){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDate[ds]||[];
    const chips = items.map(m=>{
      const lbl=(MS_BY_KEY[m.milestone_key]||{}).short||m.milestone_key;
      const full=(MS_BY_KEY[m.milestone_key]||{}).label||m.milestone_key;
      const pn=(m.projects&&m.projects.project_name)||"Project";
      return `<div class="chip" title="${esc(full+' — '+pn+' — '+(m.assigned_to||''))}">${esc(lbl)}: ${esc(pn)}</div>`;
    }).join("");
    const attrs = items.length ? `class="cal-cell has-items ${ds===today?'today':''}" onclick="openDay('${ds}')"` : `class="cal-cell ${ds===today?'today':''}"`;
    cells += `<div ${attrs}><div class="cal-daynum">${d}</div>${chips}</div>`;
  }

  const unscheduled=(projects||[]).filter(p=>!scheduled.has(p.id));
  const footer = unscheduled.length
    ? `<div class="card" style="margin-top:14px"><div class="meta" style="margin-bottom:6px">Not yet scheduled (no milestone with a date and a person)</div>
        <div class="row">${unscheduled.map(p=>`<span class="chip" onclick="go('${p.id}')">${esc(p.project_name)}</span>`).join("")}</div></div>`
    : "";

  el.outerHTML = `<div class="cal-grid">${dow}${cells}</div>${footer}`;
}
function shiftMonth(n){ calRef.setMonth(calRef.getMonth()+n); renderCalendar(); }

function openDay(ds){
  const items = (window.__calByDate||{})[ds] || [];
  const heading = new Date(ds+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const rows = items.length ? items.map(m=>{
    const full=(MS_BY_KEY[m.milestone_key]||{}).label||m.milestone_key;
    const pn=(m.projects&&m.projects.project_name)||"Project";
    const st=(m.projects&&m.projects.status)||"";
    return `<div class="day-item">
      <div class="di-top"><span class="badge">${esc(full)}</span>${st?`<span class="meta">${esc(st)}</span>`:""}</div>
      <div style="margin-top:4px"><strong>${esc(pn)}</strong></div>
      <div class="meta">Assigned to ${esc(m.assigned_to||"—")}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn small" onclick="openProjectFromModal('${m.project_id}')">Open project</button>
        <button class="btn ghost small" onclick="markDone('${m.project_id}','${m.milestone_key}')">Mark done</button>
      </div>
    </div>`;
  }).join("") : `<div class="muted-empty">Nothing on this day.</div>`;
  const bg = document.createElement("div");
  bg.className = "modal-bg"; bg.id = "dayModal";
  bg.onclick = e=>{ if(e.target===bg) closeDay(); };
  bg.innerHTML = `<div class="modal">
      <div class="row between" style="margin-bottom:12px">
        <h3 style="margin:0;font-size:17px">${esc(heading)}</h3>
        <button class="link-x" style="color:var(--muted)" onclick="closeDay()">close</button>
      </div>${rows}</div>`;
  document.body.appendChild(bg);
}
function closeDay(){ const m=document.getElementById("dayModal"); if(m) m.remove(); }
function openProjectFromModal(pid){ closeDay(); go(pid); }
async function markDone(pid, key){
  await db.from("project_milestones").update({completed:true}).eq("project_id",pid).eq("milestone_key",key);
  closeDay(); route();
}
</script>
</body>
</html>
